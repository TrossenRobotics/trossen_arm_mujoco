[project]
name = "trossen-arm-mujoco"
version = "0.1.0"
description = "MuJoCo models and demos for Trossen robots"
readme = "README.md"
authors = [
    { name = "Luke Schmitt" },
    { name = "Shantanu Parab" },
    { name = "Shuhang Xu" },
    { name = "Abhi Chothani" }
]
requires-python = ">=3.10"
dependencies = [
    "h5py>=3.16.0",
    "mujoco>=3.15.0",
    "numpy>=2.2.6",
    "opencv-python>=5.0.0.93",
]

[project.scripts]
wxai_pick_place = "trossen_arm_mujoco.scripts.wxai_pick_place:main"
wxai_follow_target = "trossen_arm_mujoco.scripts.wxai_follow_target:main"
stationary_ai_pick_place = "trossen_arm_mujoco.scripts.stationary_ai_pick_place:main"
mobile_ai_pick_place = "trossen_arm_mujoco.scripts.mobile_ai_pick_place:main"
stationary_ai_transfer_cube_record = "trossen_arm_mujoco.scripts.stationary_ai_transfer_cube_record:main"
stationary_ai_transfer_cube_eval = "trossen_arm_mujoco.scripts.stationary_ai_transfer_cube_eval:main"
episode_to_video = "trossen_arm_mujoco.scripts.episode_to_video:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.codespell]
builtin = "clear,rare,informal,usage,code,names"
check-filenames = true
check-hidden = true
interactive = 0
quiet = 34
skip="./build/*,./.venv/*,./.git*,*.toml"

[tool.isort]
profile = "black"
force_single_line = false
line_length = 99
lexicographical = true
force_sort_within_sections = true

[tool.ruff]
line-length = 99
