[project]
name = "trossen-arm-mujoco"
version = "0.1.0"
description = "MuJoCo models and IK demos for Trossen AI robots"
readme = "README.md"
authors = [
    { name = "Luke Schmitt" },
    { name = "Shantanu Parab" },
    { name = "Shuhang Xu" },
    { name = "abhi chothani", email = "achothani42@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "h5py>=3.16.0",
    "mujoco>=3.15.0",
    "numpy>=2.2.6",
    "opencv-python>=5.0.0.93",
]

[project.scripts]
trossen-arm-mujoco = "trossen_arm_mujoco:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
